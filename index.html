<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 헬스 증량 메모장</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #4caf50; margin-bottom: 20px; }
    
    .section-title { 
      font-size: 18px; 
      color: #fff; 
      margin-top: 25px; 
      margin-bottom: 12px; 
    }

    /* 상단 입력 카드 */
    .input-card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #333; }
    .input-card label { display: block; font-size: 14px; color: #aaa; margin-top: 10px; margin-bottom: 4px; }
    
    input, select, button { width: 100%; padding: 12px; margin-top: 4px; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; font-size: 15px; }
    input, select { background: #2c2c2c; color: #fff; }
    input[type="file"] { padding: 8px; font-size: 13px; color: #ccc; cursor: pointer; }
    input::placeholder { color: #777; }
    
    button.btn-add { background: #4caf50; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 18px; font-size: 16px; }
    button.btn-add:hover { background: #45a049; }

    /* 가로 배치 컨테이너 */
    #logBoxesContainer {
      display: flex;
      flex-direction: row;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    #logBoxesContainer::-webkit-scrollbar { height: 6px; }
    #logBoxesContainer::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 3px; }
    #logBoxesContainer::-webkit-scrollbar-track { background: #2c2c2c; }

    /* 부위별 칸 상자 */
    .category-box {
      flex: 0 0 260px;
      scroll-snap-align: start;
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 200px;
    }
    
    .category-title {
      font-size: 16px;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }

    ul { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
    li { 
      background: #2c2c2c; 
      padding: 8px 10px; 
      border-radius: 6px; 
      margin-bottom: 8px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 13px; 
    }
    li:last-child { margin-bottom: 0; }

    .log-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .log-thumb {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #555;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.1s ease-in-out;
    }
    .log-thumb:active {
      transform: scale(0.95);
    }

    .log-text-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .date-tag {
      color: #888;
      font-size: 11px;
      margin-right: 4px;
      font-weight: normal;
    }

    .btn-delete { 
      background: #e53935; 
      color: #fff; 
      border: none; 
      padding: 4px 8px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 11px; 
      width: auto;
      margin-top: 0;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .btn-delete:hover { background: #d32f2f; }
    .empty-text { color: #555; font-size: 13px; text-align: center; margin: auto 0; padding: 20px 0; }

    /* 🔍 사진 확대 모달 */
    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .image-modal img {
      max-width: 95%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    .modal-hint {
      position: absolute;
      bottom: 25px;
      color: #ccc;
      font-size: 13px;
      background: rgba(0,0,0,0.7);
      padding: 6px 16px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>💪 헬스 증량 메모장</h1>

  <div class="input-card">
    <label for="category" style="margin-top:0;">운동 부위 선택</label>
    <select id="category" onchange="renderInputFields()">
      <option value="가슴">🏋️‍♂️ 가슴</option>
      <option value="등">🦅 등</option>
      <option value="하체">🦵 하체</option>
      <option value="어깨">🛡️ 어깨</option>
      <option value="팔">💪 팔</option>
      <option value="유산소">🏃‍♂️ 유산소</option>
    </select>

    <div id="dynamicInputs"></div>

    <button class="btn-add" onclick="addLog()">기록 저장하기</button>
  </div>

  <div class="section-title">📋 운동 기록 목록</div>
  <div id="logBoxesContainer"></div>

  <div id="imageModal" class="image-modal" onclick="closeModal()">
    <img id="modalImg" src="" alt="확대된 운동 사진">
    <div class="modal-hint">화면을 터치하면 닫힙니다</div>
  </div>

  <script>
    const categories = [
      { name: '가슴', emoji: '🏋️‍♂️', example: 'Bench Press, 벤치프레스' },
      { name: '등', emoji: '🦅', example: 'Lat Pulldown, 렛풀다운' },
      { name: '하체', emoji: '🦵', example: 'Squat, 스쿼트' },
      { name: '어깨', emoji: '🛡️', example: 'Shoulder Press, 숄더프레스' },
      { name: '팔', emoji: '💪', example: 'Biceps Curl, 바벨컬' },
      { name: '유산소', emoji: '🏃‍♂️', example: 'Treadmill, 천국의 계단' }
    ];

    function getTodayFormatted() {
      const today = new Date();
      return `${today.getMonth() + 1}/${today.getDate()}`;
    }

    function renderInputFields() {
      const categoryVal = document.getElementById('category').value;
      const container = document.getElementById('dynamicInputs');
      const currentCat = categories.find(c => c.name === categoryVal);

      let commonHtml = `
        <label>운동 이름 (선택)</label>
        <input type="text" id="exercise" placeholder="예: ${currentCat.example}" autocomplete="off">
        
        <label>📷 운동 사진 첨부 (선택)</label>
        <input type="file" id="exerciseImg" accept="image/*">
      `;

      if (categoryVal === '유산소') {
        container.innerHTML = commonHtml + `
          <label>운동 측정</label>
          <input type="number" id="time" placeholder="운동 시간 (분)">
          <input type="number" id="calories" placeholder="소모 칼로리 (kcal)">
        `;
      } else {
        container.innerHTML = commonHtml + `
          <label>무게 및 횟수</label>
          <input type="number" id="weight" placeholder="무게 (kg)">
          <input type="number" id="reps" placeholder="횟수 (회)">
        `;
      }
    }

    function addLog() {
      const category = document.getElementById('category').value;
      const exercise = document.getElementById('exercise').value.trim();
      const imgInput = document.getElementById('exerciseImg');
      const file = imgInput ? imgInput.files[0] : null;

      if (!exercise && !file) {
        alert('운동 이름이나 사진 중 하나는 등록해 주세요!');
        return;
      }

      const logData = { category, exercise };

      if (category === '유산소') {
        const time = document.getElementById('time').value.trim();
        const calories = document.getElementById('calories').value.trim();

        if (!time || !calories) {
          alert('운동 시간과 소모 칼로리를 모두 입력해주세요!');
          return;
        }
        logData.time = time;
        logData.calories = calories;
        logData.isCardio = true;
      } else {
        const weight = document.getElementById('weight').value.trim();
        const reps = document.getElementById('reps').value.trim();

        if (!weight || !reps) {
          alert('무게와 횟수를 모두 입력해주세요!');
          return;
        }
        logData.weight = weight;
        logData.reps = reps;
        logData.isCardio = false;
      }

      saveLogWithImage(file, logData);
    }

    // 모바일 최적화 및 에러 핸들링 보완
    function saveLogWithImage(file, logData) {
      logData.dateStr = getTodayFormatted();

      if (file) {
        const reader = new FileReader();
        
        reader.onerror = function() {
          alert('사진 읽기에 실패했습니다. 사진 없이 저장합니다.');
          logData.image = null;
          commitLog(logData);
        };

        reader.onload = function(e) {
          const img = new Image();
          
          img.onerror = function() {
            alert('이미지를 로드할 수 없습니다. 사진 없이 저장합니다.');
            logData.image = null;
            commitLog(logData);
          };

          img.onload = function() {
            try {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              const maxSize = 500; // 모바일 화면에 최적화된 500px

              if (width > height) {
                if (width > maxSize) {
                  height *= maxSize / width;
                  width = maxSize;
                }
              } else {
                if (height > maxSize) {
                  width *= maxSize / height;
                  height = maxSize;
                }
              }
              canvas.width = width;
              canvas.height = height;

              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              // 압축률 0.6으로 설정해 저장 용량을 획기적으로 줄임
              logData.image = canvas.toDataURL('image/jpeg', 0.6);
            } catch (err) {
              console.error(err);
              logData.image = null;
            }
            commitLog(logData);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        logData.image = null;
        commitLog(logData);
      }
    }

    function commitLog(logData) {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      logs.push(logData);
      
      try {
        localStorage.setItem('gymLogs', JSON.stringify(logs));
        alert('저장되었습니다!');
      } catch (e) {
        alert('저장 공간(5MB)이 초과되었습니다. 이전 기록이나 사진을 몇 개 삭제 후 다시 시도해주세요.');
        return;
      }

      renderInputFields();
      loadLogs();
    }

    function loadLogs() {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      const container = document.getElementById('logBoxesContainer');
      container.innerHTML = '';

      categories.forEach(cat => {
        const catLogs = logs
          .map((log, index) => ({ ...log, originalIndex: index }))
          .filter(log => log.category === cat.name);

        const box = document.createElement('div');
        box.className = 'category-box';

        let contentHtml = `<div class="category-title">${cat.emoji} ${cat.name}</div>`;

        if (catLogs.length === 0) {
          contentHtml += `<p class="empty-text">기록 없음</p>`;
        } else {
          contentHtml += '<ul>';
          catLogs.forEach(item => {
            const detailText = item.isCardio 
              ? `${item.time}분·${item.calories}kcal`
              : `${item.weight}kg × ${item.reps}회`;
            
            const dateLabel = item.dateStr || getTodayFormatted();
            
            const exerciseName = item.exercise 
              ? `<strong>${item.exercise}</strong>` 
              : `<span style="color:#aaa;">(사진 기록)</span>`;

            const imgTag = item.image 
              ? `<img src="${item.image}" class="log-thumb" alt="운동 사진" onclick="openModalByIndex(${item.originalIndex})">` 
              : '';

            contentHtml += `
              <li>
                <div class="log-item-left">
                  ${imgTag}
                  <div class="log-text-group">
                    <div><span class="date-tag">[${dateLabel}]</span>${exerciseName}</div>
                    <div style="color: #bbb; font-size: 12px;">${detailText}</div>
                  </div>
                </div>
                <button class="btn-delete" onclick="deleteLog(${item.originalIndex})">삭제</button>
              </li>
            `;
          });
          contentHtml += '</ul>';
        }

        box.innerHTML = contentHtml;
        container.appendChild(box);
      });
    }

    function openModalByIndex(index) {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      if (logs[index] && logs[index].image) {
        document.getElementById('modalImg').src = logs[index].image;
        document.getElementById('imageModal').style.display = 'flex';
      }
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function deleteLog(index) {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      logs.splice(index, 1);
      localStorage.setItem('gymLogs', JSON.stringify(logs));
      loadLogs();
    }

    renderInputFields();
    loadLogs();
  </script>
</body>
</html>
