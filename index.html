<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 헬스 증량 메모장</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #4caf50; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    input, select, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 5px; border: none; box-sizing: border-box; font-size: 16px; }
    input, select { background: #2c2c2c; color: #fff; }
    button.btn-add { background: #4caf50; color: #fff; font-weight: bold; cursor: pointer; margin-top: 15px; }
    ul { list-style: none; padding: 0; margin-top: 8px; }
    li { background: #2c2c2c; padding: 12px; border-radius: 5px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .btn-delete { background: #e53935; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; width: auto; margin-top: 0; }
    .btn-delete:hover { background: #d32f2f; }
    
    /* 부위별 챕터 헤더 스타일 */
    .category-header { 
      color: #4caf50; 
      font-size: 18px; 
      margin-top: 25px; 
      margin-bottom: 10px; 
      border-bottom: 1px solid #333; 
      padding-bottom: 5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <h1>💪 헬스 증량 메모장</h1>

  <div class="card">
    <!-- 운동 부위 선택 카테고리 -->
    <select id="category">
      <option value="가슴">🏋️‍♂️ 가슴</option>
      <option value="등">🦅 등</option>
      <option value="하체">🦵 하체</option>
      <option value="어깨">🛡️ 어깨</option>
      <option value="팔">💪 팔</option>
      <option value="유산소">🏃‍♂️ 유산소</option>
    </select>
    
    <input type="text" id="exercise" placeholder="운동 이름 (예: 천국의 계단, 벤치프레스)">
    <input type="number" id="weight" placeholder="무게 (kg) 또는 강도">
    <input type="number" id="reps" placeholder="횟수 (회) 또는 시간 (분)">
    <button class="btn-add" onclick="addLog()">기록 저장하기</button>
  </div>

  <h2>📋오늘 기록한 운동</h2>
  <div id="logContainer"></div>

  <script>
    // 카테고리 목록에 '유산소' 추가
    const categories = ['가슴', '등', '하체', '어깨', '팔', '유산소'];

    function getEmoji(category) {
      switch(category) {
        case '가슴': return '🏋️‍♂️';
        case '등': return '🦅';
        case '하체': return '🦵';
        case '어깨': return '🛡️';
        case '팔': return '💪';
        case '유산소': return '🏃‍♂️';
        default: return '📌';
      }
    }

    function loadLogs() {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      const container = document.getElementById('logContainer');
      container.innerHTML = '';

      if (logs.length === 0) {
        container.innerHTML = '<p style="color:#888; text-align:center; margin-top: 30px;">기록된 운동이 없습니다.</p>';
        return;
      }

      // 부위별로 그룹화하여 출력
      categories.forEach(cat => {
        const catLogs = logs
          .map((log, index) => ({ ...log, originalIndex: index }))
          .filter(log => (log.category || '가슴') === cat);

        if (catLogs.length > 0) {
          const section = document.createElement('div');
          
          let html = `<div class="category-header">${getEmoji(cat)} ${cat}</div><ul>`;
          catLogs.forEach(item => {
            html += `
              <li>
                <span><strong>${item.exercise}</strong>: ${item.weight}kg/level × ${item.reps}회/분</span>
                <button class="btn-delete" onclick="deleteLog(${item.originalIndex})">삭제</button>
              </li>
            `;
          });
          html += '</ul>';
          
          section.innerHTML = html;
          container.appendChild(section);
        }
      });
    }

    function addLog() {
      const category = document.getElementById('category').value;
      const exercise = document.getElementById('exercise').value;
      const weight = document.getElementById('weight').value;
      const reps = document.getElementById('reps').value;

      if (!exercise || !weight || !reps) {
        alert('모든 항목을 입력해주세요!');
        return;
      }

      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      logs.push({ category, exercise, weight, reps });
      localStorage.setItem('gymLogs', JSON.stringify(logs));

      document.getElementById('exercise').value = '';
      document.getElementById('weight').value = '';
      document.getElementById('reps').value = '';

      loadLogs();
    }

    function deleteLog(index) {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      logs.splice(index, 1);
      localStorage.setItem('gymLogs', JSON.stringify(logs));
      loadLogs();
    }

    loadLogs();
  </script>
</body>
</html>
