<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 헬스 증량 메모장</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 12px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #4caf50; font-size: 18px; margin: 0 0 10px 0; }
    
    .section-title { 
      font-size: 15px; 
      color: #fff; 
      margin-top: 12px; 
      margin-bottom: 8px; 
      font-weight: bold;
    }

    .input-card { 
      background: #1e1e1e; 
      padding: 12px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      border: 1px solid #333; 
    }
    
    label { display: block; font-size: 12px; color: #aaa; margin-bottom: 2px; }
    
    input, select, button { 
      width: 100%; 
      padding: 8px 10px; 
      border-radius: 6px; 
      border: 1px solid #333; 
      box-sizing: border-box; 
      font-size: 13px; 
    }
    input, select { background: #2c2c2c; color: #fff; }
    input[type="file"] { padding: 5px; font-size: 11px; color: #ccc; cursor: pointer; }
    input::placeholder { color: #777; }
    
    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .input-col {
      flex: 1;
      min-width: 0;
    }
    
    button.btn-add { 
      background: #4caf50; 
      color: #fff; 
      font-weight: bold; 
      border: none; 
      cursor: pointer; 
      margin-top: 10px; 
      font-size: 14px; 
      padding: 10px;
    }
    button.btn-add:active { background: #388e3c; }

    #logBoxesContainer {
      display: flex;
      flex-direction: row;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    #logBoxesContainer::-webkit-scrollbar { height: 4px; }
    #logBoxesContainer::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 2px; }
    #logBoxesContainer::-webkit-scrollbar-track { background: #2c2c2c; }

    .category-box {
      flex: 0 0 240px;
      scroll-snap-align: start;
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }
    
    .category-title {
      font-size: 15px;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 8px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }

    ul { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
    li { 
      background: #2c2c2c; 
      padding: 6px 8px; 
      border-radius: 6px; 
      margin-bottom: 6px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 12px; 
    }
    li:last-child { margin-bottom: 0; }

    .log-item-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
    }

    .log-thumb {
      width: 38px;
      height: 38px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #555;
      flex-shrink: 0;
      cursor: pointer;
    }

    .log-text-group {
      display: flex;
      flex-direction: column;
      gap: 1px;
      overflow: hidden;
    }

    .date-tag {
      color: #888;
      font-size: 10px;
      margin-right: 3px;
      font-weight: normal;
    }

    .btn-delete { 
      background: #e53935; 
      color: #fff; 
      border: none; 
      padding: 3px 6px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 10px; 
      width: auto;
      margin-top: 0;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .empty-text { color: #555; font-size: 12px; text-align: center; margin: auto 0; padding: 15px 0; }

    .backup-card {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      border: 1px solid #333;
    }
    .backup-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-backup {
      background: #2196f3;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 8px;
    }
    .btn-restore {
      background: #ff9800;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 8px;
    }

    .image-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .image-modal img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.8);
      object-fit: contain;
    }
    .modal-hint {
      position: absolute;
      bottom: 25px;
      color: #ccc;
      font-size: 12px;
      background: rgba(0,0,0,0.7);
      padding: 4px 12px;
      border-radius: 20px;
    }
  </style>
</head>
<body>

  <h1>헬스 증량 메모장</h1>

  <div class="input-card">
    <label for="category">운동 부위 선택</label>
    <select id="category" onchange="renderInputFields()">
      <option value="가슴">가슴</option>
      <option value="등">등</option>
      <option value="하체">하체</option>
      <option value="어깨">어깨</option>
      <option value="팔">팔</option>
      <option value="유산소">유산소</option>
    </select>

    <div id="dynamicInputs"></div>

    <button class="btn-add" id="saveBtn" onclick="addLog()">기록 저장하기</button>
  </div>

  <div class="section-title">운동 기록 목록</div>
  <div id="logBoxesContainer"></div>

  <div class="backup-card">
    <label>간편 데이터 백업 / 복원</label>
    <div class="backup-btn-group">
      <button class="btn-backup" onclick="exportToShare()">카톡/메모장에 백업</button>
      <button class="btn-restore" onclick="importFromText()">코드로 불러오기</button>
    </div>
  </div>

  <div id="imageModal" class="image-modal" onclick="closeModal()">
    <img id="modalImg" src="" alt="확대된 운동 사진">
    <div class="modal-hint">화면을 터치하면 닫힙니다</div>
  </div>

  <script>
    const categories = [
      { name: '가슴', example: '벤치프레스' },
      { name: '등', example: '렛풀다운' },
      { name: '하체', example: '스쿼트' },
      { name: '어깨', example: '숄더프레스' },
      { name: '팔', example: '바벨컬' },
      { name: '유산소', example: '천국의 계단' }
    ];

    function getTodayFormatted() {
      const today = new Date();
      return `${today.getMonth() + 1}/${today.getDate()}`;
    }

    function renderInputFields() {
      const categorySelect = document.getElementById('category');
      if (!categorySelect) return;

      const categoryVal = categorySelect.value;
      const container = document.getElementById('dynamicInputs');
      const currentCat = categories.find(c => c.name === categoryVal) || categories[0];

      const isCardio = (categoryVal === '유산소');

      container.innerHTML = `
        <div class="input-row">
          <div class="input-col">
            <label>운동 이름</label>
            <input type="text" id="exercise" placeholder="예: ${currentCat.example}" autocomplete="off">
          </div>
          <div class="input-col">
            <label>사진 첨부</label>
            <input type="file" id="exerciseImg" accept="image/*">
          </div>
        </div>
        <div class="input-row">
          ${isCardio ? `
            <div class="input-col">
              <label>운동 시간 (분)</label>
              <input type="number" id="time" placeholder="분">
            </div>
            <div class="input-col">
              <label>소모 칼로리 (kcal)</label>
              <input type="number" id="calories" placeholder="kcal">
            </div>
          ` : `
            <div class="input-col">
              <label>무게 (kg)</label>
              <input type="number" id="weight" placeholder="kg">
            </div>
            <div class="input-col">
              <label>횟수 (회)</label>
              <input type="number" id="reps" placeholder="회">
            </div>
          `}
        </div>
      `;
    }

    // 예외 상황 발생 시에도 저장이 멈추지 않는 초안전 이미지 압축 함수
    function compressImage(file) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        try {
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              const img = new Image();
              img.onload = function() {
                try {
                  const canvas = document.createElement('canvas');
                  const MAX_WIDTH = 350;
                  const MAX_HEIGHT = 350;
                  let width = img.width;
                  let height = img.height;

                  if (width > height) {
                    if (width > MAX_WIDTH) {
                      height = Math.round((height * MAX_WIDTH) / width);
                      width = MAX_WIDTH;
                    }
                  } else {
                    if (height > MAX_HEIGHT) {
                      width = Math.round((width * MAX_HEIGHT) / height);
                      height = MAX_HEIGHT;
                    }
                  }

                  canvas.width = width;
                  canvas.height = height;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, width, height);
                  resolve(canvas.toDataURL('image/jpeg', 0.5));
                } catch (err) {
                  resolve(null);
                }
              };
              img.onerror = function() {
                resolve(null);
              };
              img.src = e.target.result;
            } catch (err) {
              resolve(null);
            }
          };
          reader.onerror = function() {
            resolve(null);
          };
          reader.readAsDataURL(file);
        } catch (err) {
          resolve(null);
        }
      });
    }

    function getLogs() {
      try {
        return JSON.parse(localStorage.getItem('gym_logs_v2') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveLogs(logs) {
      try {
        localStorage.setItem('gym_logs_v2', JSON.stringify(logs));
        return true;
      } catch (e) {
        alert("저장 공간이 부족합니다. 백업 코드로 백업 후 오래된 사진 기록을 삭제해 주세요.");
        return false;
      }
    }

    async function addLog() {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "저장 중...";
      saveBtn.disabled = true;

      try {
        const categoryEl = document.getElementById('category');
        const category = categoryEl ? categoryEl.value : '가슴';

        const exerciseEl = document.getElementById('exercise');
        const exercise = exerciseEl ? exerciseEl.value.trim() : '';

        const imgInput = document.getElementById('exerciseImg');
        const file = imgInput && imgInput.files && imgInput.files[0] ? imgInput.files[0] : null;

        if (!exercise && !file) {
          alert('운동 이름이나 사진 중 하나는 등록해 주세요!');
          return;
        }

        let imageBase64 = null;
        if (file) {
          imageBase64 = await compressImage(file);
        }

        const logData = { 
          id: Date.now(),
          category, 
          exercise,
          dateStr: getTodayFormatted(),
          imageBase64
        };

        if (category === '유산소') {
          const timeEl = document.getElementById('time');
          const caloriesEl = document.getElementById('calories');
          const time = timeEl ? timeEl.value.trim() : '';
          const calories = caloriesEl ? caloriesEl.value.trim() : '';

          if (!time || !calories) {
            alert('운동 시간과 소모 칼로리를 모두 입력해주세요!');
            return;
          }
          logData.time = time;
          logData.calories = calories;
          logData.isCardio = true;
        } else {
          const weightEl = document.getElementById('weight');
          const repsEl = document.getElementById('reps');
          const weight = weightEl ? weightEl.value.trim() : '';
          const reps = repsEl ? repsEl.value.trim() : '';

          if (!weight || !reps) {
            alert('무게와 횟수를 모두 입력해주세요!');
            return;
          }
          logData.weight = weight;
          logData.reps = reps;
          logData.isCardio = false;
        }

        const currentLogs = getLogs();
        currentLogs.push(logData);
        
        if (saveLogs(currentLogs)) {
          renderInputFields();
          loadLogs();
        }
      } catch (err) {
        alert("저장 중 오류가 발생했습니다: " + err.message);
      } finally {
        saveBtn.innerText = "기록 저장하기";
        saveBtn.disabled = false;
      }
    }

    function loadLogs() {
      const logs = getLogs();
      const container = document.getElementById('logBoxesContainer');
      if (!container) return;
      container.innerHTML = '';

      categories.forEach(cat => {
        const catLogs = logs.filter(log => log.category === cat.name);

        const box = document.createElement('div');
        box.className = 'category-box';

        let contentHtml = `<div class="category-title">${cat.name}</div>`;

        if (catLogs.length === 0) {
          contentHtml += `<p class="empty-text">기록 없음</p>`;
        } else {
          contentHtml += '<ul>';
          catLogs.forEach(item => {
            const detailText = item.isCardio 
              ? `${item.time}분·${item.calories}kcal`
              : `${item.weight}kg × ${item.reps}회`;
            
            const dateLabel = item.dateStr || getTodayFormatted();
            
            const exerciseName = item.exercise 
              ? `<strong>${item.exercise}</strong>` 
              : `<span style="color:#aaa;">(사진 기록)</span>`;

            let imgTag = '';
            if (item.imageBase64) {
              imgTag = `<img src="${item.imageBase64}" class="log-thumb" alt="운동 사진" onclick="openModal('${item.imageBase64}')">`;
            }

            contentHtml += `
              <li>
                <div class="log-item-left">
                  ${imgTag}
                  <div class="log-text-group">
                    <div><span class="date-tag">[${dateLabel}]</span>${exerciseName}</div>
                    <div style="color: #bbb; font-size: 11px;">${detailText}</div>
                  </div>
                </div>
                <button class="btn-delete" onclick="deleteLog(${item.id})">삭제</button>
              </li>
            `;
          });
          contentHtml += '</ul>';
        }

        box.innerHTML = contentHtml;
        container.appendChild(box);
      });
    }

    function openModal(imgUrl) {
      document.getElementById('modalImg').src = imgUrl;
      document.getElementById('imageModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    function deleteLog(id) {
      let logs = getLogs();
      logs = logs.filter(item => item.id !== id);
      saveLogs(logs);
      loadLogs();
    }

    async function exportToShare() {
      const logs = getLogs();
      if (logs.length === 0) {
        alert("백업할 운동 기록이 없습니다.");
        return;
      }

      const jsonText = JSON.stringify(logs);

      if (navigator.share) {
        try {
          await navigator.share({
            title: '헬스 메모장 백업 코드',
            text: jsonText
          });
          return;
        } catch (err) {}
      }

      try {
        await navigator.clipboard.writeText(jsonText);
        alert("백업 코드가 클립보드에 복사되었습니다!\n메모장이나 카카오톡에 붙여넣어 두세요.");
      } catch (e) {
        prompt("아래 텍스트 전체를 복사해서 저장해 두세요:", jsonText);
      }
    }

    function importFromText() {
      const codeInput = prompt("복사해둔 백업 코드를 아래에 붙여넣어 주세요:");
      if (!codeInput || !codeInput.trim()) return;

      try {
        const importedLogs = JSON.parse(codeInput.trim());
        if (!Array.isArray(importedLogs)) {
          alert("올바르지 않은 백업 코드 형식입니다.");
          return;
        }

        if (!confirm(`총 ${importedLogs.length}개의 기록을 복원하시겠습니까?`)) {
          return;
        }

        const currentLogs = getLogs();
        for (const item of importedLogs) {
          item.id = Date.now() + Math.random();
          currentLogs.push(item);
        }
        
        if (saveLogs(currentLogs)) {
          alert("기록이 성공적으로 복원되었습니다!");
          loadLogs();
        }
      } catch (err) {
        alert("백업 코드를 읽는 중 오류가 발생했습니다.");
      }
    }

    renderInputFields();
    loadLogs();
  </script>
</body>
</html>
