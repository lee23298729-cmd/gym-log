<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 헬스 증량 메모장</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #4caf50; margin-bottom: 20px; }
    
    .section-title { 
      font-size: 18px; 
      color: #fff; 
      margin-top: 25px; 
      margin-bottom: 12px; 
    }

    /* 상단 입력 카드 */
    .input-card { background: #1e1e1e; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #333; }
    .input-card label { display: block; font-size: 14px; color: #aaa; margin-bottom: 6px; }
    
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; font-size: 15px; }
    input, select { background: #2c2c2c; color: #fff; }
    input::placeholder { color: #777; }
    
    button.btn-add { background: #4caf50; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; font-size: 16px; }
    button.btn-add:hover { background: #45a049; }

    /* 가로 배치 컨테이너 (옆으로 스크롤 가능) */
    #logBoxesContainer {
      display: flex;
      flex-direction: row;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    /* 스크롤바 스타일 */
    #logBoxesContainer::-webkit-scrollbar { height: 6px; }
    #logBoxesContainer::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 3px; }
    #logBoxesContainer::-webkit-scrollbar-track { background: #2c2c2c; }

    /* 가로로 놓이는 부위별 칸 상자 */
    .category-box {
      flex: 0 0 240px; /* 박스 가로 크기 고정 */
      scroll-snap-align: start;
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }
    
    .category-title {
      font-size: 16px;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid #333;
      padding-bottom: 6px;
    }

    ul { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
    li { 
      background: #2c2c2c; 
      padding: 8px 10px; 
      border-radius: 6px; 
      margin-bottom: 6px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 13px; 
    }
    li:last-child { margin-bottom: 0; }

    /* 운동 항목 내부 날짜 태그 스타일 */
    .date-tag {
      color: #888;
      font-size: 11px;
      margin-right: 4px;
      font-weight: normal;
    }

    .btn-delete { 
      background: #e53935; 
      color: #fff; 
      border: none; 
      padding: 3px 6px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 11px; 
      width: auto;
      margin-top: 0;
      margin-left: 6px;
    }
    .btn-delete:hover { background: #d32f2f; }
    .empty-text { color: #555; font-size: 13px; text-align: center; margin: auto 0; padding: 20px 0; }
  </style>
</head>
<body>

  <h1>💪 헬스 증량 메모장</h1>

  <!-- 1. 운동 기록 입력 섹션 -->
  <div class="input-card">
    <label for="category">운동 부위 선택</label>
    <select id="category" onchange="renderInputFields()">
      <option value="가슴">🏋️‍♂️ 가슴</option>
      <option value="등">🦅 등</option>
      <option value="하체">🦵 하체</option>
      <option value="어깨">🛡️ 어깨</option>
      <option value="팔">💪 팔</option>
      <option value="유산소">🏃‍♂️ 유산소</option>
    </select>

    <div id="dynamicInputs"></div>

    <button class="btn-add" onclick="addLog()">기록 저장하기</button>
  </div>

  <!-- 2. 가로로 놓인 부위별 칸 -->
  <div class="section-title">📋 운동 기록 목록</div>
  <div id="logBoxesContainer"></div>

  <script>
    const categories = [
      { name: '가슴', emoji: '🏋️‍♂️' },
      { name: '등', emoji: '🦅' },
      { name: '하체', emoji: '🦵' },
      { name: '어깨', emoji: '🛡️' },
      { name: '팔', emoji: '💪' },
      { name: '유산소', emoji: '🏃‍♂️' }
    ];

    // 오늘 날짜 포맷 (예: 7/30)
    function getTodayFormatted() {
      const today = new Date();
      return `${today.getMonth() + 1}/${today.getDate()}`;
    }

    // 선택 부위에 따른 입력창 생성
    function renderInputFields() {
      const category = document.getElementById('category').value;
      const container = document.getElementById('dynamicInputs');

      if (category === '유산소') {
        container.innerHTML = `
          <input type="text" id="exercise" placeholder="운동 이름 (예: 천국의 계단)">
          <input type="number" id="time" placeholder="운동 시간 (분)">
          <input type="number" id="calories" placeholder="소모 칼로리 (kcal)">
        `;
      } else {
        container.innerHTML = `
          <input type="text" id="exercise" placeholder="운동 이름 (예: 벤치프레스)">
          <input type="number" id="weight" placeholder="무게 (kg)">
          <input type="number" id="reps" placeholder="횟수 (회)">
        `;
      }
    }

    // 운동 기록 저장
    function addLog() {
      const category = document.getElementById('category').value;
      const exercise = document.getElementById('exercise').value.trim();

      if (!exercise) {
        alert('운동 이름을 입력해주세요!');
        return;
      }

      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      const dateStr = getTodayFormatted(); // 현재 날짜 (월/일) 저장

      if (category === '유산소') {
        const time = document.getElementById('time').value.trim();
        const calories = document.getElementById('calories').value.trim();

        if (!time || !calories) {
          alert('운동 시간과 소모 칼로리를 모두 입력해주세요!');
          return;
        }
        logs.push({ dateStr, category, exercise, time, calories, isCardio: true });
      } else {
        const weight = document.getElementById('weight').value.trim();
        const reps = document.getElementById('reps').value.trim();

        if (!weight || !reps) {
          alert('무게와 횟수를 모두 입력해주세요!');
          return;
        }
        logs.push({ dateStr, category, exercise, weight, reps, isCardio: false });
      }

      localStorage.setItem('gymLogs', JSON.stringify(logs));

      renderInputFields();
      loadLogs();
    }

    // 기록 불러오기 (각 운동 옆에 날짜 표기)
    function loadLogs() {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      const container = document.getElementById('logBoxesContainer');
      container.innerHTML = '';

      categories.forEach(cat => {
        const catLogs = logs
          .map((log, index) => ({ ...log, originalIndex: index }))
          .filter(log => log.category === cat.name);

        const box = document.createElement('div');
        box.className = 'category-box';

        let contentHtml = `<div class="category-title">${cat.emoji} ${cat.name}</div>`;

        if (catLogs.length === 0) {
          contentHtml += `<p class="empty-text">기록 없음</p>`;
        } else {
          contentHtml += '<ul>';
          catLogs.forEach(item => {
            const detailText = item.isCardio 
              ? `${item.time}분·${item.calories}kcal`
              : `${item.weight}kg × ${item.reps}회`;
            
            // 날짜 정보가 없으면 오늘 날짜 기본 적용
            const dateLabel = item.dateStr || getTodayFormatted();

            contentHtml += `
              <li>
                <span><span class="date-tag">[${dateLabel}]</span><strong>${item.exercise}</strong>: ${detailText}</span>
                <button class="btn-delete" onclick="deleteLog(${item.originalIndex})">삭제</button>
              </li>
            `;
          });
          contentHtml += '</ul>';
        }

        box.innerHTML = contentHtml;
        container.appendChild(box);
      });
    }

    // 기록 삭제
    function deleteLog(index) {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      logs.splice(index, 1);
      localStorage.setItem('gymLogs', JSON.stringify(logs));
      loadLogs();
    }

    // 초기화 실행
    renderInputFields();
    loadLogs();
  </script>
</body>
</html>
