<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://gym-log-olive.vercel.app/icon.png?v=2">
  <link rel="shortcut icon" type="image/png" href="https://gym-log-olive.vercel.app/icon.png?v=2">
  <link rel="apple-touch-icon" href="https://gym-log-olive.vercel.app/icon.png?v=2">
  <meta name="naver-site-verification" content="1ceeefc6bddcd4423359dd171e2448a4c3799bad" />
  <meta name="google-site-verification" content="Xld-9XoSoAHU6xRWMumumboF-SvCs8IV74IsALpEQGI" />
  <meta property="og:title" content="나의 헬스 증량 메모장">
  <meta property="og:description" content="부위별 운동 무게, 횟수, 세트 및 신체 변화를 기록하는 웹 메모장입니다.">
  <meta property="og:image" content="https://gym-log-olive.vercel.app/icon.png?v=2">
  <meta property="og:type" content="website">
  <title>나의 헬스 증량 메모장 | 간편 운동 기록</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 12px 12px 80px 12px; max-width: 500px; margin: 0 auto; box-sizing: border-box; }
    h1 { text-align: center; color: #4caf50; font-size: 18px; margin: 0 0 10px 0; }
    .section-title { font-size: 15px; color: #fff; margin-top: 12px; margin-bottom: 8px; font-weight: bold; }
    .input-card { background: #1e1e1e; padding: 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; }
    label { display: block; font-size: 11px; color: #aaa; margin-bottom: 3px; }
    input, select, button { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; font-size: 12px; }
    input, select { background: #2c2c2c; color: #fff; margin-bottom: 8px; }
    button { cursor: pointer; }
    .btn-add { background: #4caf50; color: #fff; font-weight: bold; border: none; margin-top: 4px; font-size: 14px; padding: 10px; }
    
    /* Timer Style */
    .timer-card { background: #252525; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #444; text-align: center; }
    .timer-display { font-size: 24px; font-weight: bold; font-family: monospace; color: #4caf50; margin: 5px 0; }
    .timer-btns { display: flex; gap: 5px; }
    .timer-btns button { flex: 1; padding: 6px; font-size: 12px; }

    .volume-info { background: #252525; padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; font-size: 11px; color: #4caf50; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
    #logBoxesContainer { display: flex; flex-direction: row; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
    .category-box { flex: 0 0 250px; background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 8px; padding: 12px; }
    .category-title { font-size: 15px; font-weight: bold; color: #4caf50; margin-bottom: 8px; border-bottom: 1px solid #333; }
    
    /* Calendar Style */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .cal-day { background: #1e1e1e; padding: 10px; text-align: center; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid #333; }
    .cal-day.has-log { background: #2e7d32; }
    .cal-header { text-align: center; font-weight: bold; margin-bottom: 10px; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: #1e1e1e; border-top: 1px solid #333; display: flex; height: 55px; z-index: 1000; }
    .nav-btn { flex: 1; background: none; border: none; color: #777; font-size: 12px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .nav-btn.active { color: #4caf50; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <h1>나의 헬스 증량 메모장</h1>

  <!-- Workout Tab -->
  <div id="tab-workout" class="tab-content active">
    <div class="timer-card">
      <div id="timerDisplay" class="timer-display">00:00</div>
      <div class="timer-btns">
        <button onclick="toggleTimer()">시작/정지</button>
        <button onclick="resetTimer()">초기화</button>
      </div>
    </div>
    <div class="input-card">
      <label for="category">운동 부위</label>
      <select id="category" onchange="renderInputFields()">
        <option value="가슴">가슴</option><option value="등">등</option><option value="하체">하체</option>
        <option value="어깨">어깨</option><option value="팔">팔</option><option value="유산소">유산소</option>
      </select>
      <div id="dynamicInputs"></div>
      <button class="btn-add" onclick="addLog()">기록 저장</button>
    </div>
    <div id="logBoxesContainer"></div>
  </div>

  <!-- Stats Tab -->
  <div id="tab-stats" class="tab-content">
    <div class="input-card">
      <div class="section-title">신체 기록</div>
      <input type="text" id="statWeight" placeholder="몸무게 (kg)">
      <button class="btn-add" onclick="addStatRecord()">저장</button>
    </div>
  </div>

  <!-- Calendar Tab -->
  <div id="tab-calendar" class="tab-content">
    <div class="input-card">
      <div class="cal-header" id="calMonth"></div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div id="calLogs" style="margin-top:15px;"></div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('tab-workout', this)">운동</button>
    <button class="nav-btn" onclick="switchTab('tab-stats', this)">그래프</button>
    <button class="nav-btn" onclick="switchTab('tab-calendar', this)">달력</button>
  </div>

  <script>
    // Timer Logic
    let seconds = 0, timerInterval = null;
    function toggleTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
      else { timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000); }
    }
    function resetTimer() { clearInterval(timerInterval); timerInterval = null; seconds = 0; updateTimerDisplay(); }
    function updateTimerDisplay() {
      const m = Math.floor(seconds/60), s = seconds%60;
      document.getElementById('timerDisplay').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    // App Logic
    function getLogs() { return JSON.parse(localStorage.getItem('gym_logs_v4') || '[]'); }
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
      if(tabId === 'tab-calendar') renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const logs = getLogs();
      grid.innerHTML = '';
      const days = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
      for(let i=1; i<=days; i++) {
        const d = document.createElement('div');
        d.className = 'cal-day';
        d.innerText = i;
        if(logs.find(l => l.dateStr === `${new Date().getMonth()+1}/${i}`)) d.classList.add('has-log');
        d.onclick = () => showLogsByDate(`${new Date().getMonth()+1}/${i}`);
        grid.appendChild(d);
      }
      document.getElementById('calMonth').innerText = new Date().getMonth()+1 + '월';
    }

    function showLogsByDate(date) {
      const logs = getLogs().filter(l => l.dateStr === date);
      document.getElementById('calLogs').innerHTML = `<strong>${date} 기록:</strong> ` + (logs.length ? logs.map(l => l.exercise).join(', ') : '없음');
    }

    function renderInputFields() {
      const isCardio = document.getElementById('category').value === '유산소';
      document.getElementById('dynamicInputs').innerHTML = isCardio ? 
        `<input type="text" id="time" placeholder="운동 시간 (분)">` : 
        `<input type="text" id="exercise" placeholder="운동 이름"><input type="text" id="weight" placeholder="무게 (kg)"><input type="text" id="reps" placeholder="횟수"><input type="text" id="sets" placeholder="세트">`;
    }

    function addLog() {
      const logs = getLogs();
      const newLog = { 
        id: Date.now(), 
        dateStr: `${new Date().getMonth()+1}/${new Date().getDate()}`,
        category: document.getElementById('category').value,
        exercise: document.getElementById('category').value === '유산소' ? '유산소' : document.getElementById('exercise').value
      };
      logs.push(newLog);
      localStorage.setItem('gym_logs_v4', JSON.stringify(logs));
      alert('저장 완료');
    }

    renderInputFields();
  </script>
</body>
</html>
