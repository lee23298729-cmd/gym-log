<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 헬스 증량 메모장</title>
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 20px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #4caf50; margin-bottom: 25px; }
    
    /* 각 부위별 카드 박스 */
    .card { 
      background: #1e1e1e; 
      padding: 18px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
      border: 1px solid #2d2d2d; 
    }
    .card-header { 
      font-size: 18px; 
      font-weight: bold; 
      color: #4caf50; 
      margin-bottom: 14px; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      border-bottom: 1px solid #333; 
      padding-bottom: 8px; 
    }
    
    /* 입력 양식 */
    .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    input { 
      width: 100%; 
      padding: 10px 12px; 
      border-radius: 6px; 
      border: 1px solid #333; 
      background: #2c2c2c; 
      color: #fff; 
      box-sizing: border-box; 
      font-size: 14px; 
    }
    input::placeholder { color: #888; }
    
    /* 저장 버튼 */
    button.btn-add { 
      width: 100%; 
      padding: 10px; 
      background: #4caf50; 
      color: #fff; 
      border: none; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      font-size: 14px; 
    }
    button.btn-add:hover { background: #45a049; }
    
    /* 운동 기록 리스트 */
    ul { list-style: none; padding: 0; margin-top: 15px; margin-bottom: 0; }
    li { 
      background: #2c2c2c; 
      padding: 10px 12px; 
      border-radius: 6px; 
      margin-bottom: 6px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 14px; 
    }
    .btn-delete { 
      background: #e53935; 
      color: #fff; 
      border: none; 
      padding: 4px 8px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 12px; 
    }
    .btn-delete:hover { background: #d32f2f; }
    .empty-msg { color: #666; font-size: 13px; text-align: center; margin-top: 12px; }
  </style>
</head>
<body>

  <h1>💪 헬스 증량 메모장</h1>

  <!-- 각 부위별 카드가 들어가는 컨테이너 -->
  <div id="cardsContainer"></div>

  <script>
    // 카테고리 구성 정의 (근력 vs 유산소)
    const config = [
      { key: '가슴', emoji: '🏋️‍♂️', type: 'strength' },
      { key: '등', emoji: '🦅', type: 'strength' },
      { key: '하체', emoji: '🦵', type: 'strength' },
      { key: '어깨', emoji: '🛡️', type: 'strength' },
      { key: '팔', emoji: '💪', type: 'strength' },
      { key: '유산소', emoji: '🏃‍♂️', type: 'cardio' }
    ];

    // 카드 화면 렌더링
    function renderApp() {
      const container = document.getElementById('cardsContainer');
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      container.innerHTML = '';

      config.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';

        // 해당 카테고리에 속한 기록만 필터링
        const catLogs = logs
          .map((log, index) => ({ ...log, originalIndex: index }))
          .filter(log => log.category === item.key);

        // 입력 폼 분기 (근력 vs 유산소)
        let inputsHtml = '';
        if (item.type === 'strength') {
          inputsHtml = `
            <input type="text" id="ex-${item.key}" placeholder="운동 이름 (예: 벤치프레스)">
            <input type="number" id="val1-${item.key}" placeholder="무게 (kg)">
            <input type="number" id="val2-${item.key}" placeholder="횟수 (회)">
          `;
        } else {
          inputsHtml = `
            <input type="text" id="ex-${item.key}" placeholder="운동 이름 (예: 천국의 계단)">
            <input type="number" id="val1-${item.key}" placeholder="시간 (분)">
            <input type="number" id="val2-${item.key}" placeholder="소모 칼로리 (kcal)">
          `;
        }

        // 기록 리스트 생성
        let listHtml = '';
        if (catLogs.length === 0) {
          listHtml = `<p class="empty-msg">기록된 ${item.key} 운동이 없습니다.</p>`;
        } else {
          listHtml = '<ul>';
          catLogs.forEach(log => {
            const detailStr = item.type === 'strength' 
              ? `${log.val1}kg × ${log.val2}회`
              : `${log.val1}분 · ${log.val2}kcal 소모`;
            listHtml += `
              <li>
                <span><strong>${log.exercise}</strong>: ${detailStr}</span>
                <button class="btn-delete" onclick="deleteLog(${log.originalIndex})">삭제</button>
              </li>
            `;
          });
          listHtml += '</ul>';
        }

        // 카드 내부에 HTML 조립
        card.innerHTML = `
          <div class="card-header">${item.emoji} ${item.key}</div>
          <div class="input-group">
            ${inputsHtml}
          </div>
          <button class="btn-add" onclick="addLog('${item.key}', '${item.type}')">기록 저장</button>
          ${listHtml}
        `;

        container.appendChild(card);
      });
    }

    // 특정 부위 기록 저장
    function addLog(category, type) {
      const exInput = document.getElementById(`ex-${category}`);
      const val1Input = document.getElementById(`val1-${category}`);
      const val2Input = document.getElementById(`val2-${category}`);

      const exercise = exInput.value.trim();
      const val1 = val1Input.value.trim();
      const val2 = val2Input.value.trim();

      if (!exercise || !val1 || !val2) {
        alert('모든 항목을 입력해주세요!');
        return;
      }

      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      logs.push({ category, exercise, val1, val2, type });
      localStorage.setItem('gymLogs', JSON.stringify(logs));

      // 화면 새로고침
      renderApp();
    }

    // 기록 삭제
    function deleteLog(index) {
      const logs = JSON.parse(localStorage.getItem('gymLogs') || '[]');
      logs.splice(index, 1);
      localStorage.setItem('gymLogs', JSON.stringify(logs));
      renderApp();
    }

    // 앱 초기화
    renderApp();
  </script>
</body>
</html>
