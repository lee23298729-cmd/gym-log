<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 네이버 서치어드바이저 소유 확인 태그 -->
  <meta name="naver-site-verification" content="1ceeefc6bddcd4423359dd171e2448a4c3799bad" />

  <!-- 구글 서치콘솔 소유 확인 태그 -->
  <meta name="google-site-verification" content="Xld-9XoSoAHU6xRWMumumboF-SvCs8IV74IsALpEQGI" />

  <!-- 검색엔진 최적화 (SEO) 태그 -->
  <title>나의 헬스 증량 메모장 | 간편 운동 기록</title>
  <meta name="description" content="부위별 운동 무게, 횟수, 세트를 자유롭게 기록하고 증량 과정을 확인하는 웹 메모장입니다.">
  
  <style>
    body { font-family: sans-serif; background-color: #121212; color: #fff; padding: 12px; max-width: 500px; margin: 0 auto; }
    h1 { text-align: center; color: #4caf50; font-size: 18px; margin: 0 0 10px 0; }
    
    .section-title { 
      font-size: 15px; 
      color: #fff; 
      margin-top: 12px; 
      margin-bottom: 8px; 
      font-weight: bold;
    }

    .input-card { 
      background: #1e1e1e; 
      padding: 12px; 
      border-radius: 10px; 
      margin-bottom: 10px; 
      border: 1px solid #333; 
    }
    
    label { display: block; font-size: 11px; color: #aaa; margin-bottom: 3px; }
    
    input, select, button { 
      width: 100%; 
      padding: 8px 10px; 
      border-radius: 6px; 
      border: 1px solid #333; 
      box-sizing: border-box; 
      font-size: 12px; 
    }
    input, select { background: #2c2c2c; color: #fff; margin-bottom: 8px; }
    input::placeholder { color: #777; }
    
    .input-row {
      display: flex;
      gap: 5px;
    }
    .input-col {
      flex: 1;
      min-width: 0;
    }
    
    button.btn-add { 
      background: #4caf50; 
      color: #fff; 
      font-weight: bold; 
      border: none; 
      cursor: pointer; 
      margin-top: 4px; 
      font-size: 14px; 
      padding: 10px;
    }
    button.btn-add:active { background: #388e3c; }

    #logBoxesContainer {
      display: flex;
      flex-direction: row;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }

    #logBoxesContainer::-webkit-scrollbar { height: 4px; }
    #logBoxesContainer::-webkit-scrollbar-thumb { background: #4caf50; border-radius: 2px; }
    #logBoxesContainer::-webkit-scrollbar-track { background: #2c2c2c; }

    .category-box {
      flex: 0 0 250px;
      scroll-snap-align: start;
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      padding: 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 160px;
    }
    
    .category-title {
      font-size: 15px;
      font-weight: bold;
      color: #4caf50;
      margin-bottom: 8px;
      border-bottom: 1px solid #333;
      padding-bottom: 4px;
    }

    ul { list-style: none; padding: 0; margin: 0; flex-grow: 1; }
    li { 
      background: #2c2c2c; 
      padding: 6px 8px; 
      border-radius: 6px; 
      margin-bottom: 6px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 12px; 
    }
    li:last-child { margin-bottom: 0; }

    .log-text-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .date-tag {
      color: #888;
      font-size: 10px;
      margin-right: 3px;
    }

    .log-thumb {
      width: 32px;
      height: 32px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 6px;
      flex-shrink: 0;
      border: 1px solid #444;
    }

    .log-item-left {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .btn-delete { 
      background: #e53935; 
      color: #fff; 
      border: none; 
      padding: 3px 6px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 10px; 
      width: auto;
      margin-top: 0;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .empty-text { color: #555; font-size: 12px; text-align: center; margin: auto 0; padding: 15px 0; }

    /* 이미지 크게보기 모달 */
    #imageModal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }
    #imageModal img {
      max-width: 100%;
      max-height: 80vh;
      border-radius: 8px;
    }
    #imageModal span {
      position: absolute;
      top: 20px; right: 25px;
      color: #fff; font-size: 28px; font-weight: bold;
      cursor: pointer;
    }

    /* 쿠팡 파트너스 추천 스타일 */
    .recommend-card {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      border: 1px solid #333;
    }
    .recommend-title {
      font-size: 13px;
      font-weight: bold;
      color: #64b5f6;
      margin-bottom: 10px;
    }
    .recommend-item {
      background: #2c2c2c;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .recommend-icon {
      width: 40px;
      height: 40px;
      background: #383838;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .recommend-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }
    .recommend-info a {
      color: #4caf50;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      line-height: 1.3;
    }
    .recommend-desc {
      color: #aaa;
      font-size: 11px;
    }
    .coupang-notice {
      font-size: 10px;
      color: #777;
      margin-top: 8px;
      line-height: 1.3;
    }

    .backup-card {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 10px;
      margin-top: 15px;
      border: 1px solid #333;
    }
    .backup-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .btn-backup {
      background: #2196f3;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 8px;
    }
    .btn-restore {
      background: #ff9800;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 8px;
    }
  </style>
</head>
<body>

  <h1>나의 헬스 증량 메모장</h1>

  <div class="input-card">
    <label for="category">운동 부위 선택</label>
    <select id="category" onchange="onCategoryChange()">
      <option value="가슴">가슴</option>
      <option value="등">등</option>
      <option value="하체">하체</option>
      <option value="어깨">어깨</option>
      <option value="팔">팔</option>
      <option value="유산소">유산소</option>
    </select>

    <div id="dynamicInputs"></div>

    <button class="btn-add" id="saveBtn" onclick="addLog()">기록 저장하기</button>
  </div>

  <div class="section-title">운동 기록 목록</div>
  <div id="logBoxesContainer"></div>

  <!-- 자동 쿠팡 파트너스 추천 카드 -->
  <div class="recommend-card" id="recommendContainer"></div>

  <div class="backup-card">
    <label>간편 데이터 백업 / 복원</label>
    <div class="backup-btn-group">
      <button class="btn-backup" onclick="exportToShare()">카톡/메모장에 백업</button>
      <button class="btn-restore" onclick="importFromText()">코드로 불러오기</button>
    </div>
  </div>

  <!-- 이미지 확대보기 모달 -->
  <div id="imageModal" onclick="closeModal()">
    <span onclick="closeModal()">&times;</span>
    <img id="modalImg" src="" alt="확대 이미지">
  </div>

  <script>
    const coupangProducts = {
      '가슴': [{ title: '제로투히어로 프로 그립 (헬스 리프팅 스트랩)', desc: '등·가슴 운동 시 악력 보조 및 손목 부상 방지', link: 'https://link.coupang.com/a/fOkRPWX12a', icon: '🏋️‍♂️' }],
      '등': [{ title: '베르사그립 프로 (Versa Gripps Pro)', desc: '등·가슴 운동 자극 극대화 및 압도적 접지력', link: 'https://link.coupang.com/a/fOkUgNytvU', icon: '💪' }],
      '하체': [{ title: '제로투히어로 무릎 보호대 니랩 (카모)', desc: '스쿼트 및 고중량 하체 운동 시 무릎 관절 보호', link: 'https://link.coupang.com/a/fOkW9oV4MK', icon: '🦵' }],
      '어깨': [{ title: '베르사그립 프로 (Versa Gripps Pro)', desc: '프레스 및 오버헤드 운동 시 그립 안정성', link: 'https://link.coupang.com/a/fOkUgNytvU', icon: '💪' }],
      '팔': [{ title: '뉴욕웨이 올에이지 단백질 보충제 2kg', desc: 'WPI · BCAA · 산양유 단백질 함유', link: 'https://link.coupang.com/a/fOkLORrxYG', icon: '🥤' }],
      '유산소': [{ title: '잠스트 카프 슬리브 (종아리 보호대)', desc: '러닝 및 유산소 운동 시 종아리 피로도 감소', link: 'https://link.coupang.com/a/fOkZAgsjJs', icon: '👟' }]
    };

    const categories = [
      { name: '가슴', example: '벤치프레스' },
      { name: '등', example: '렛풀다운' },
      { name: '하체', example: '스쿼트' },
      { name: '어깨', example: '숄더프레스' },
      { name: '팔', example: '바벨컬' },
      { name: '유산소', example: '천국의 계단' }
    ];

    function getTodayFormatted() {
      const today = new Date();
      return `${today.getMonth() + 1}/${today.getDate()}`;
    }

    function onCategoryChange() {
      renderInputFields();
      renderRecommendations();
    }

    function renderRecommendations() {
      const categoryEl = document.getElementById('category');
      const container = document.getElementById('recommendContainer');
      if (!categoryEl || !container) return;

      const category = categoryEl.value;
      const products = coupangProducts[category] || coupangProducts['가슴'];

      let html = `<div class="recommend-title">[${category}] 추천 헬스 용품</div>`;
      products.forEach(item => {
        html += `
          <div class="recommend-item">
            <div class="recommend-icon">${item.icon}</div>
            <div class="recommend-info">
              <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
              <div class="recommend-desc">${item.desc}</div>
            </div>
          </div>
        `;
      });
      html += `<div class="coupang-notice">※ 이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>`;
      container.innerHTML = html;
    }

    function renderInputFields() {
      const categorySelect = document.getElementById('category');
      if (!categorySelect) return;

      const categoryVal = categorySelect.value;
      const container = document.getElementById('dynamicInputs');
      const currentCat = categories.find(c => c.name === categoryVal) || categories[0];
      const isCardio = (categoryVal === '유산소');

      container.innerHTML = `
        <div class="input-row">
          <div class="input-col" style="flex: 2;">
            <label>운동 이름</label>
            <input type="text" id="exercise" placeholder="예: ${currentCat.example}" autocomplete="off">
          </div>
          <div class="input-col" style="flex: 1.5;">
            <label>사진 첨부</label>
            <input type="file" id="photoInput" accept="image/*" style="font-size:11px; padding:6px;">
          </div>
        </div>

        <div class="input-row">
          ${isCardio ? `
            <div class="input-col">
              <label>운동 시간</label>
              <input type="text" id="time" placeholder="예: 30분 ⏱️">
            </div>
            <div class="input-col">
              <label>소모 칼로리</label>
              <input type="text" id="calories" placeholder="예: 300kcal 🔥">
            </div>
            <div class="input-col">
              <label>강도 / 속도</label>
              <input type="text" id="intensity" placeholder="예: Level 8">
            </div>
          ` : `
            <div class="input-col">
              <label>무게</label>
              <input type="text" id="weight" placeholder="예: 60kg">
            </div>
            <div class="input-col">
              <label>횟수</label>
              <input type="text" id="reps" placeholder="예: 12회 🔥">
            </div>
            <div class="input-col">
              <label>세트</label>
              <input type="text" id="sets" placeholder="예: 3세트 💯">
            </div>
          `}
        </div>
      `;
    }

    function getLogs() {
      try {
        return JSON.parse(localStorage.getItem('gym_logs_v4') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveLogs(logs) {
      try {
        localStorage.setItem('gym_logs_v4', JSON.stringify(logs));
        return true;
      } catch (e) {
        alert("저장 공간이 부족합니다. 사진 용량이 클 수 있습니다.");
        return false;
      }
    }

    function resizeImage(file, callback) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = function(event) {
        const img = new Image();
        img.src = event.target.result;
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 400;
          const MAX_HEIGHT = 400;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }
      }
    }

    function addLog() {
      const categoryEl = document.getElementById('category');
      const category = categoryEl ? categoryEl.value : '가슴';
      const exerciseEl = document.getElementById('exercise');
      const exercise = exerciseEl ? exerciseEl.value.trim() : '';

      if (!exercise) {
        alert('운동 이름을 입력해 주세요!');
        return;
      }

      const photoInput = document.getElementById('photoInput');
      const file = photoInput && photoInput.files[0] ? photoInput.files[0] : null;

      const processLogData = (photoBase64) => {
        const logData = { 
          id: Date.now(),
          category, 
          exercise,
          photo: photoBase64 || null,
          dateStr: getTodayFormatted()
        };

        if (category === '유산소') {
          const time = document.getElementById('time').value.trim();
          const calories = document.getElementById('calories').value.trim();
          const intensity = document.getElementById('intensity').value.trim();

          if (!time || !calories) {
            alert('운동 시간과 소모 칼로리를 입력해주세요!');
            return;
          }
          logData.time = time;
          logData.calories = calories;
          logData.intensity = intensity;
          logData.isCardio = true;
        } else {
          const weight = document.getElementById('weight').value.trim();
          const reps = document.getElementById('reps').value.trim();
          const sets = document.getElementById('sets').value.trim();

          if (!weight || !reps || !sets) {
            alert('무게, 횟수, 세트를 모두 입력해주세요!');
            return;
          }
          logData.weight = weight;
          logData.reps = reps;
          logData.sets = sets;
          logData.isCardio = false;
        }

        const currentLogs = getLogs();
        currentLogs.push(logData);
        
        if (saveLogs(currentLogs)) {
          renderInputFields();
          loadLogs();
        }
      };

      if (file) {
        resizeImage(file, function(compressedDataUrl) {
          processLogData(compressedDataUrl);
        });
      } else {
        processLogData(null);
      }
    }

    function loadLogs() {
      const logs = getLogs();
      const container = document.getElementById('logBoxesContainer');
      if (!container) return;
      container.innerHTML = '';

      categories.forEach(cat => {
        const catLogs = logs.filter(log => log.category === cat.name);
        const box = document.createElement('div');
        box.className = 'category-box';

        let contentHtml = `<div class="category-title">${cat.name}</div>`;

        if (catLogs.length === 0) {
          contentHtml += `<p class="empty-text">기록 없음</p>`;
        } else {
          contentHtml += '<ul>';
          catLogs.forEach(item => {
            const detailText = item.isCardio 
              ? `${item.time} / ${item.calories}${item.intensity ? ' / ' + item.intensity : ''}`
              : `${item.weight} / ${item.reps} / ${item.sets}`;
            
            const dateLabel = item.dateStr || getTodayFormatted();
            const thumbHtml = item.photo ? `<img src="${item.photo}" class="log-thumb" onclick="openModal('${item.photo}')">` : '';

            contentHtml += `
              <li>
                <div class="log-item-left">
                  ${thumbHtml}
                  <div class="log-text-group">
                    <div><span class="date-tag">[${dateLabel}]</span><strong>${item.exercise}</strong></div>
                    <div style="color: #bbb; font-size: 11px;">${detailText}</div>
                  </div>
                </div>
                <button class="btn-delete" onclick="deleteLog(${item.id})">삭제</button>
              </li>
            `;
          });
          contentHtml += '</ul>';
        }

        box.innerHTML = contentHtml;
        container.appendChild(box);
      });
    }

    function deleteLog(id) {
      let logs = getLogs();
      logs = logs.filter(item => item.id !== id);
      saveLogs(logs);
      loadLogs();
    }

    function openModal(src) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('imageModal').style.display = 'none';
    }

    async function exportToShare() {
      const logs = getLogs();
      if (logs.length === 0) {
        alert("백업할 운동 기록이 없습니다.");
        return;
      }
      const jsonText = JSON.stringify(logs);
      if (navigator.share) {
        try {
          await navigator.share({ title: '헬스 메모장 백업', text: jsonText });
          return;
        } catch (err) {}
      }
      try {
        await navigator.clipboard.writeText(jsonText);
        alert("백업 코드가 클립보드에 복사되었습니다!");
      } catch (e) {
        prompt("복사해서 저장해 두세요:", jsonText);
      }
    }

    function importFromText() {
      const codeInput = prompt("복사해둔 백업 코드를 붙여넣어 주세요:");
      if (!codeInput || !codeInput.trim()) return;

      try {
        const importedLogs = JSON.parse(codeInput.trim());
        if (!Array.isArray(importedLogs)) {
          alert("형식이 올바르지 않습니다.");
          return;
        }
        if (!confirm(`총 ${importedLogs.length}개의 기록을 복원하시겠습니까?`)) return;

        const currentLogs = getLogs();
        for (const item of importedLogs) {
          item.id = Date.now() + Math.random();
          currentLogs.push(item);
        }
        if (saveLogs(currentLogs)) {
          alert("복원 완료되었습니다!");
          loadLogs();
        }
      } catch (err) {
        alert("오류가 발생했습니다.");
      }
    }

    renderInputFields();
    renderRecommendations();
    loadLogs();
  </script>
</body>
</html>
